# Runtime + dev environment. Verify with: python scripts/check_env_deps.py
name: srt-dev
channels:
  - conda-forge
dependencies:
  - astroplan
  - astropy
  - astroquery
  - fastapi
  - matplotlib
  - numpy
  - parse
  - pip
  - pydantic>=2
  - pyjwt
  - pytest
  - pyserial
  - python=3.10
  - pyvisa
  - pyyaml
  - pyzmq
  - scipy
  - starlette
  - uvicorn
  - uvloop
  - pip:
      - -e .

